version: "3.8"

services:
  db:
    image: postgres:18.0
    container_name: witnes-db
    command: postgres -c max_connections=50 -c shared_buffers=256MB
    environment:
      POSTGRES_DB: witnes
      POSTGRES_USER: witnes
      POSTGRES_PASSWORD: witnes_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - infra

  rabbitmq:
    image: rabbitmq:3-management
    container_name: witnes-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: witnes
      RABBITMQ_DEFAULT_PASS: witnes_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - infra

  redis:
    image: redis:7-alpine
    container_name: witnes-redis
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - infra

networks:
  infra:

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
