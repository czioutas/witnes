version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: witnes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - infra

  rabbitmq:
    image: rabbitmq:3-management
    container_name: witnes-rabbitmq
    env_file:
      - /opt/witnes/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - infra

  postgres:
    image: postgres:18-alpine
    container_name: witnes-postgres
    env_file:
      - /opt/witnes/.env
    environment:
      POSTGRES_DB: witnes
      POSTGRES_USER: witnes
    ports:
      - "5432:5432"
    volumes:
      - /mnt/db-volume/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - infra

networks:
  infra:

volumes:
  rabbitmq_data:
  redis_data: